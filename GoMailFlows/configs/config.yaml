server:
  host: "0.0.0.0"
  port: 8080
  read_timeout: 30s
  write_timeout: 30s
  shutdown_timeout: 10s
  environment: dev
  base_url: http://localhost:8080

database:
  host: localhost
  port: 5432
  user: mailflows
  password: mailflows
  name: mailflows
  ssl_mode: disable
  max_open_conns: 25
  max_idle_conns: 10
  conn_max_lifetime: 5m

redis:
  host: localhost
  port: 6379
  db: 0

jwt:
  secret: "change-me-in-production-use-a-long-random-string"
  access_token_ttl: 15m
  refresh_token_ttl: 168h
  issuer: mailflows

smtp:
  host: "0.0.0.0"
  port: 25
  tls_port: 587
  max_connections: 100
  max_message_size: 26214400
  auth_required: true

imap:
  host: "0.0.0.0"
  port: 143
  tls_port: 993
  max_connections: 100

jmap:
  host: "0.0.0.0"
  port: 8081

admin:
  default_email: admin@hitechcloud.io
  default_password: admin123456

marketing:
  max_recipients_per_campaign: 10000
  unsubscribe_base_url: https://mail.example.com/unsubscribe
  bounce_threshold: 5

tls:
  enabled: false
  acme: false
  domains: []

mcp:
  enabled: true
  host: "0.0.0.0"
  port: 8082
