name: Deploy HiTechCloud MailFlows

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  DEPLOY_HOST: 116.118.2.52
  DEPLOY_USER: root
  DEPLOY_PATH: /opt/mailflows
  GO_VERSION: '1.23'
  NODE_VERSION: '22'

jobs:
  # ============================================================
  # Build Go Backend
  # ============================================================
  build-backend:
    name: Build Go Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: GoMailFlows/go.sum

      - name: Build Go backend
        working-directory: GoMailFlows
        run: |
          mkdir -p bin
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o bin/mailflows ./cmd/server

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: mailflows-backend
          path: GoMailFlows/bin/mailflows
          retention-days: 3

  # ============================================================
  # Build Frontend
  # ============================================================
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          NODE_ENV: production

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: mailflows-frontend
          path: frontend/dist/
          retention-days: 3

  # ============================================================
  # Deploy to Production Server
  # ============================================================
  deploy:
    name: Deploy to Production
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://mail.photuegroup.vn
    concurrency:
      group: production-deploy
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: mailflows-backend
          path: artifacts/backend/

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: mailflows-frontend
          path: artifacts/frontend/

      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ env.DEPLOY_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy to server
        run: |
          set -e
          SSH="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=10 ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }}"
          SCP="scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no"

          echo "=========================================="
          echo "Deploying HiTechCloud MailFlows"
          echo "=========================================="

          # 1. Create directories
          echo ">>> Creating directories..."
          $SSH "mkdir -p ${{ env.DEPLOY_PATH }}/{bin,configs,logs,docs,web/static}"

          # 2. Stop service
          echo ">>> Stopping service..."
          $SSH "systemctl stop mailflows 2>/dev/null || true"

          # 3. Backup current binary
          echo ">>> Backing up current binary..."
          $SSH "cp ${{ env.DEPLOY_PATH }}/bin/mailflows ${{ env.DEPLOY_PATH }}/bin/mailflows.bak 2>/dev/null || true"

          # 4. Upload new binary
          echo ">>> Uploading backend binary..."
          $SCP artifacts/backend/mailflows ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }}:${{ env.DEPLOY_PATH }}/bin/mailflows
          $SSH "chmod +x ${{ env.DEPLOY_PATH }}/bin/mailflows"

          # 5. Upload frontend
          echo ">>> Uploading frontend..."
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            artifacts/frontend/ \
            ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }}:${{ env.DEPLOY_PATH }}/web/static/

          # 6. Upload systemd service
          echo ">>> Uploading systemd service..."
          $SCP GoMailFlows/contrib/mailflows.service ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }}:/etc/systemd/system/mailflows.service

          # 7. Upload OpenAPI docs & default config if not exists
          echo ">>> Uploading docs and config templates..."
          $SCP GoMailFlows/docs/openapi.yaml ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }}:${{ env.DEPLOY_PATH }}/docs/
          $SSH "[ -f ${{ env.DEPLOY_PATH }}/configs/config.yaml ] || cp GoMailFlows/configs/config.yaml ${{ env.DEPLOY_PATH }}/configs/config.yaml 2>/dev/null || true"

          # 8. Reload and start
          echo ">>> Starting service..."
          $SSH "systemctl daemon-reload && systemctl start mailflows"

          # 9. Wait and check
          echo ">>> Waiting for service..."
          sleep 5
          STATUS=$($SSH "systemctl is-active mailflows" 2>/dev/null || echo "inactive")
          if [ "$STATUS" = "active" ]; then
            echo "✅ Service is running!"
          else
            echo "❌ Service failed to start!"
            $SSH "journalctl -u mailflows --no-pager -n 20"
            exit 1
          fi

          echo "=========================================="
          echo "Deployment complete!"
          echo "=========================================="

      - name: Verify deployment
        run: |
          echo ">>> Verifying API..."
          for i in $(seq 1 10); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "http://${{ env.DEPLOY_HOST }}:8080/health" 2>/dev/null || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ API health check passed!"
              exit 0
            fi
            echo "Attempt $i/10: HTTP $HTTP_CODE, retrying in 5s..."
            sleep 5
          done
          echo "❌ API health check failed"
          exit 1

      - name: Rollback on failure
        if: failure()
        run: |
          SSH="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }}"
          echo ">>> Rolling back..."
          $SSH "cp ${{ env.DEPLOY_PATH }}/bin/mailflows.bak ${{ env.DEPLOY_PATH }}/bin/mailflows 2>/dev/null && systemctl restart mailflows && echo 'Rollback complete' || echo 'Rollback failed'"
